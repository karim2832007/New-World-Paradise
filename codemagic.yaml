workflows:
  ios-unsigned:
    name: "NWP – Unsigned iOS Build"
    environment:
      vars:
        APP_NAME: "NWP"
        APP_SHORT_NAME: "NWP"
        APP_VERSION: "0.2.8.1"
        DEVELOPER_NAME: "Gaming Mods"
      xcode: latest

    scripts:
      - name: Set project version
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $APP_VERSION" Info.plist

      - name: Build Xcode project (unsigned)
        script: |
          xcodebuild \
            -project NWP.xcodeproj \
            -scheme NWP \
            -configuration Release \
            -archivePath build/NWP.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Manually package unsigned IPA
        script: |
          mkdir -p Payload
          cp -R build/NWP.xcarchive/Products/Applications/*.app Payload/
          zip -r NWP-unsigned.ipa Payload
          mkdir -p build/ipa
          mv NWP-unsigned.ipa build/ipa/

    artifacts:
      - build/ipa/*.ipa
